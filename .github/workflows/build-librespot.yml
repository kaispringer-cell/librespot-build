name: librespot für Phoniebox bauen (arm64, ALSA)

# Baut exakt dieselbe librespot-Version mit denselben Features, die
# Phoniebox-Installer/build_librespot.sh bisher auf dem Pi selbst kompiliert
# (native-tls alsa-backend with-libmdns), aber auf einem nativen arm64-Runner
# statt auf einem Raspberry Pi - Minuten statt Stunden. Ergebnis landet als
# GitHub-Release-Anhang, den install.sh künftig zuerst versucht herunterzuladen,
# bevor es (als Rückfallebene) selbst auf dem Pi baut.
#
# Manuell auslösen: Reiter "Actions" -> "librespot für Phoniebox bauen" ->
# "Run workflow". Läuft nicht automatisch bei jedem Push, weil die
# librespot-Version hier bewusst fest eingetragen ist (siehe LIBRESPOT_VERSION) -
# ein neuer Lauf ist nur nötig, wenn diese Version geändert wird.

on:
  workflow_dispatch: {}

env:
  LIBRESPOT_VERSION: v0.8.0
  RUST_TOOLCHAIN: 1.90.0
  # native-tls alsa-backend with-libmdns: identisch zu build_librespot.sh
  LIBRESPOT_FEATURES: "native-tls alsa-backend with-libmdns"

permissions:
  contents: write

jobs:
  build:
    # Nativer arm64-Linux-Runner - kein Cross-Compiling, keine fehlenden
    # arm64-Bibliotheken, kein QEMU. Erfordert einen GitHub-Plan mit Zugriff
    # auf gehostete arm64-Runner (Stand heute: öffentliche Repos kostenlos,
    # private je nach Plan).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libssl-dev protobuf-compiler git ca-certificates

      - name: Rust ${{ env.RUST_TOOLCHAIN }} installieren
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            https://static.rust-lang.org/rustup/dist/aarch64-unknown-linux-gnu/rustup-init -o rustup-init
          chmod 700 rustup-init
          ./rustup-init -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: librespot ${{ env.LIBRESPOT_VERSION }} klonen
        run: |
          git clone --depth 1 --branch "$LIBRESPOT_VERSION" https://github.com/librespot-org/librespot.git source
          git -C source fetch --depth 1 origin tag "$LIBRESPOT_VERSION"
          git -C source checkout --detach "$LIBRESPOT_VERSION"
          # Exakte Commit-ID im Log festhalten, falls der Tag später verschoben wird.
          git -C source rev-parse HEAD

      - name: Bauen (${{ env.LIBRESPOT_FEATURES }})
        run: |
          cargo build --manifest-path source/Cargo.toml --release --locked \
            --no-default-features --features "$LIBRESPOT_FEATURES"

      - name: ALSA-Backend prüfen
        run: |
          # "--backend '?'" selbst wurde verworfen: list_backends() druckt über println! auf
          # stdout und beendet den Prozess sofort mit exit(0) - bei einer Pipe (wie hier durch
          # command substitution) wird stdout blockweise gepuffert, und process::exit()
          # überspringt das Leeren dieses Puffers. Die Versionszeile kommt trotzdem an (die
          # kommt über den log-Mechanismus auf stderr, sofort durchgereicht), aber die
          # eigentliche Backend-Liste geht beim sofortigen Prozessende verloren - ein bekanntes
          # Rust-Verhalten, kein Fehler im Build. Zuverlässiger: direkt prüfen, wogegen das
          # Binary gelinkt wurde.
          ldd source/target/release/librespot
          ldd source/target/release/librespot | grep -q libasound

      - name: Artefakt benennen und Prüfsumme erzeugen
        run: |
          artifact="phoniebox-librespot-${LIBRESPOT_VERSION}-arm64"
          cp source/target/release/librespot "$artifact"
          sha256sum "$artifact" > "${artifact}.sha256"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: librespot-${{ env.LIBRESPOT_VERSION }}-arm64
          name: librespot ${{ env.LIBRESPOT_VERSION }} (arm64, ALSA)
          body: |
            Fertig gebautes `librespot` ${{ env.LIBRESPOT_VERSION }} für arm64
            (Raspberry Pi OS, Features: ${{ env.LIBRESPOT_FEATURES }}).
            Wird von Phoniebox-Installers `install.sh` automatisch heruntergeladen,
            falls erreichbar; sonst baut der Installer wie bisher selbst auf dem Pi.
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
